<div class="dashboard-container">

  <h1 class="titulo">🌤 Dashboard Climático</h1>

  <div class="filtros">

    <div class="campo">
      <label>Cidade</label>
      <select [(ngModel)]="cidade">
        <option>São Paulo</option>
        <option>Rio de Janeiro</option>
        <option>Brasília</option>
      </select>
    </div>

    <div class="campo">
      <label>Data Inicial</label>
      <input type="date" [(ngModel)]="inicio">
    </div>

    <div class="campo">
      <label>Data Final</label>
      <input type="date" [(ngModel)]="fim">
    </div>

    <button class="btn-buscar"
     (click)="buscar()">
      Buscar
    </button>

  </div>

  @if (estatisticas) {
  <div class="cards">

    <div class="card">
      <span class="icone">🌡</span>
      <div>
        <small>Mínima</small>
        <h3>{{estatisticas.minima}}°C</h3>
      </div>
    </div>

    <div class="card">
      <span class="icone">🔥</span>
      <div>
        <small>Máxima</small>
        <h3>{{estatisticas.maxima}}°C</h3>
      </div>
    </div>

    <div class="card">
      <span class="icone">📊</span>
      <div>
        <small>Média</small>
        <h3>{{estatisticas.media | number:'1.1-1'}}°C</h3>
      </div>
    </div>

    <div class="card">
      <span class="icone">📝</span>
      <div>
        <small>Registros</small>
        <h3>{{estatisticas.registros}}</h3>
      </div>
    </div>

  </div>
}

  <div class="graficos">
    <div class="grafico-box">
      <canvas id="graficoTemp"></canvas>
    </div>

    <div class="grafico-box">
      <canvas id="graficoUmidade"></canvas>
    </div>
  </div>

</div>
